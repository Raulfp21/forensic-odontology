<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forensic Odontology Simulator</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; }
    canvas { display: block; touch-action: none; }

    #top-panel {
      position: absolute; top: 12px; left: 12px; right: 12px;
      background: rgba(10,10,10,0.85);
      border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 10px 14px; backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
    }
    #top-panel h1 { margin: 0; font-size: 1em; color: #4ade80; font-weight: 600; }
    #top-panel p { margin: 0; font-size: 0.75em; color: #888; }
    #tooth-info { font-size: 0.8em; color: #60a5fa; text-align: right; }

    #side-buttons {
      position: absolute; right: 12px; top: 80px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #side-buttons button {
      background: rgba(10,10,10,0.85);
      border: 1px solid #2a2a2a; border-radius: 8px;
      color: #4ade80; padding: 10px 14px;
      font-size: 0.8em; font-weight: 600;
      cursor: pointer;
    }
    #side-buttons button:active { background: rgba(74,222,128,0.15); }

    #bottom-panel {
      position: absolute; bottom: 16px; left: 12px; right: 12px;
      background: rgba(10,10,10,0.9);
      border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 14px 16px; backdrop-filter: blur(10px);
    }
    #age-row { display: flex; align-items: center; gap: 12px; }
    #age-label { font-size: 0.85em; color: #aaa; white-space: nowrap; }
    #age-value { font-size: 1.4em; font-weight: 700; color: #4ade80; min-width: 60px; text-align: right; }
    input[type=range] {
      flex: 1; appearance: none; height: 6px;
      background: #2a2a2a; border-radius: 3px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 22px; height: 22px;
      background: #4ade80; border-radius: 50%;
      cursor: pointer; box-shadow: 0 0 10px rgba(74,222,128,0.5);
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; font-size: 1.1em; color: #4ade80;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <script>
    (function(){
      if (window.__diagBannerInstalled) return;
      window.__diagBannerInstalled = true;
      const bar = document.createElement('div');
      bar.id = '__diag';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#7a1d1d;color:#fff;font:12px monospace;padding:6px 10px;z-index:9999;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto;';
      document.body.appendChild(bar);
      window.__diagShow = (msg) => { bar.style.display='block'; bar.textContent += msg + '\n'; };
      window.addEventListener('error', e => window.__diagShow('JS ERROR: ' + (e.message || e.error)));
      window.addEventListener('unhandledrejection', e => window.__diagShow('PROMISE REJECTION: ' + (e.reason && e.reason.message || e.reason)));
      const origErr = console.error;
      console.error = function(...args){ origErr.apply(console,args); window.__diagShow('CONSOLE.ERROR: ' + args.join(' ')); };
    })();
  </script>
  <div id="top-panel">
    <div>
      <h1>Forensic Odontology</h1>
      <p>Age Estimation Simulator</p>
    </div>
    <div id="tooth-info">Loading...</div>
  </div>

  <div id="side-buttons">
    <button onclick="resetView()">Reset View</button>
  </div>

  <div id="bottom-panel">
    <div id="age-row">
      <span id="age-label">Age</span>
      <input type="range" id="ageSlider" min="0" max="25" step="0.1" value="0">
      <span id="age-value">0.0</span>
    </div>
  </div>

  <div id="loading">Loading anatomy model...</div>

  <script src="https://www.gstatic.com/draco/versioned/decoders/1.5.7/draco_decoder.js"></script>
<script src="https://www.gstatic.com/draco/versioned/decoders/1.5.7/draco_wasm_wrapper.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
<script type="module">
  import "./apstrc.js";
  window.APSRTC.init();
</script>
<script type="module">
  import "./fdi_chart.js";
  window.FDIChart.init();
</script>
</body>
</html>
